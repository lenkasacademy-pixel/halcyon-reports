<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Halcyon Call-back List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first list of call cards, sticky state tabs on top */
:root{
  --bg:#F4F7F7; --panel:#FFFFFF; --fg:#14211F; --muted:#5B6B69; --line:#DCE5E4;
  --ap:#0E8A8C; --ap-soft:#D6EEEE; --tg:#7348B0; --tg-soft:#E8DFF5;
  --call:#1F7A4D; --wa:#1E9E57; --warn:#B7791F; --bad:#C9524A;
  --f-head:"Manrope",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1716; --panel:#172221; --fg:#E6EEED; --muted:#93A4A2; --line:#283735;
  --ap:#3CC2C4; --ap-soft:#173B3C; --tg:#AE8BE6; --tg-soft:#2C2342;
  --call:#3DBB7C; --wa:#3DBB7C; --warn:#E8B556; --bad:#E57A72; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-family:var(--f-head);font-size:24px;margin:0;font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.filters button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs .n{font-weight:500;opacity:.7;margin-left:4px}
input[type=search]{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ap);outline-offset:2px}
.list{display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.card.done{opacity:.55}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top>div{min-width:0}
.name{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.phone{font-variant-numeric:tabular-nums;font-size:15px;letter-spacing:.02em;user-select:all}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.AP{background:var(--ap-soft);color:var(--ap)} .chip.TG{background:var(--tg-soft);color:var(--tg)} .chip.X{background:var(--line);color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.tag{font-size:12px;font-weight:600;color:var(--warn)}
.actions{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.actions a,.actions button{font:inherit;font-size:14px;font-weight:600;text-align:center;text-decoration:none;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.actions a.call{background:var(--call);border-color:var(--call);color:#fff}
.actions a.wa{color:var(--wa);border-color:var(--wa)}
.outcome{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
select{font:inherit;font-size:13.5px;padding:7px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.note{font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.lock{display:grid;gap:10px;place-items:start;padding:30px 0}
.empty{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:6px">
    <h1>Call-back list</h1>
    <p class="muted" id="sub">Halcyon website enquiries that were called but didn't pick up.</p>
  </header>

  <div id="locked" class="lock" hidden>
    <p><b>This link is missing its key.</b></p>
    <p class="muted">Open the full link you were sent. It ends with <code>#k=…</code>. Copy all of it, including that last part.</p>
  </div>

  <div id="app" hidden style="display:grid;gap:14px">
    <div class="note" id="howto"></div>
    <div class="bar">
      <div class="tabs" role="group" aria-label="State">
        <button data-s="all" aria-pressed="true">All<span class="n" id="n-all"></span></button>
        <button data-s="AP" aria-pressed="false">Andhra Pradesh<span class="n" id="n-AP"></span></button>
        <button data-s="TG" aria-pressed="false">Telangana<span class="n" id="n-TG"></span></button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input type="search" id="q" placeholder="Search name, area, pain…" style="flex:1;min-width:180px" aria-label="Search">
        <select id="show" aria-label="Show"><option value="todo">To call</option><option value="done">Marked</option><option value="all">Everyone</option></select>
      </div>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

  if(!m){ $("locked").hidden = false; return; }
  try{
    const raw = b64(PAYLOAD), key = await crypto.subtle.importKey("raw", b64(m[1]), "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv: raw.slice(0,12)}, key, raw.slice(12));
    D = JSON.parse(new TextDecoder().decode(plain));
  }catch(e){ $("locked").hidden = false; $("locked").querySelector("b").textContent = "This key doesn't open the list."; return; }
  $("app").hidden = false;
  $("sub").textContent = `${D.length} people from November who were called once and didn't answer. List taken from the CRM on ${SNAP}.`;
  $("howto").innerHTML = `<b>How to use:</b> tap <b>Call</b>. If they don't pick up, send the <b>WhatsApp</b> message. Choose what happened under each person, so you can see what's left on this phone. <b>Then change the stage in the CRM as usual</b>, because this page doesn't update the CRM.`;
  render();
}

function ago(t){ const h = (Date.now() - new Date(t.replace(" ","T")+":00+05:30"))/36e5; return h<24 ? Math.round(h)+" h ago" : Math.round(h/24)+" days ago"; }
function fmtT(t){ return new Date(t.replace(" ","T")+":00+05:30").toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}); }
const OUT = [["","Not called yet"],["picked","Picked up – update CRM"],["noans","No answer again"],["wa","WhatsApp sent"],["callback","Asked to call later"],["wrong","Wrong / switched off"]];

function render(){
  const q = $("q").value.trim().toLowerCase(), show = $("show").value;
  for(const s of ["all","AP","TG"]){ const n = D.filter(o => (s==="all"||o.state===s) && !marks[o.id]).length; $("n-"+s).textContent = n; }
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.s===tab));
  const list = D.filter(o => (tab==="all" || o.state===tab)
      && (show==="all" || (show==="done") === !!marks[o.id])
      && (!q || (o.name+" "+o.area+" "+o.pain+" "+o.phone).toLowerCase().includes(q)))
    .sort((a,b) => b.t.localeCompare(a.t));
  if(!list.length){ $("list").innerHTML = `<div class="empty">${show==="todo" ? "Nobody left to call here." : "No one matches."}</div>`; return; }
  $("list").innerHTML = list.map(o => {
    const st = o.state==="AP"||o.state==="TG" ? o.state : "X";
    const first = (o.name||"").split(" ")[0] || "";
    const msg = `Namaste ${first}, this is Halcyon Pain Management, Hyderabad. You enquired about ${o.pain ? o.pain.toLowerCase()+" " : ""}pain and we tried calling you. When is a good time to talk? Please reply here or call 8585072072.`;
    return `<article class="card${marks[o.id]?" done":""}">
      <div class="top">
        <div><div class="name">${esc(o.name||"No name")}</div><div class="phone">+91 ${esc(o.phone.replace(/(\d{5})(\d{5})/,"$1 $2"))}</div></div>
        <span class="chip ${st}">${st==="X"?"Area unclear":st}</span>
      </div>
      <div class="meta">
        <span>Area <b>${esc(o.area||"–")}</b></span>
        <span>Pain <b>${esc(o.pain||"–")}</b></span>
        ${o.since?`<span>Since <b>${esc(o.since)}</b></span>`:""}
        <span>Enquired <b>${fmtT(o.t)}</b> (${ago(o.t)})</span>
        <span>Tries so far <b>${o.tries}</b></span>
        ${o.forms>1?`<span class="tag">Filled the form ${o.forms} times</span>`:""}
        ${o.status==="New"?`<span class="tag">Never called</span>`:""}
        ${o.followup?`<span class="tag">${esc(o.followup)}</span>`:""}
      </div>
      <div class="actions">
        <a class="call" href="tel:+91${o.phone}">Call</a>
        <a class="wa" href="https://wa.me/91${o.phone}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp</a>
        <button data-copy="${o.phone}" aria-label="Copy number">Copy</button>
      </div>
      <div class="outcome"><label for="o-${o.id}" class="muted">What happened</label>
        <select id="o-${o.id}" data-id="${o.id}">${OUT.map(([v,l])=>`<option value="${v}"${(marks[o.id]||"")===v?" selected":""}>${l}</option>`).join("")}</select></div>
    </article>`;
  }).join("");
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-s]"); if(t){ tab = t.dataset.s; render(); return; }
  const c = e.target.closest("[data-copy]");
  if(c){ const v = c.dataset.copy; (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(()=>{c.textContent="Copied"; setTimeout(()=>c.textContent="Copy",1500)}).catch(()=>{c.textContent=v}); }
});
document.addEventListener("change", e => {
  if(e.target.dataset && e.target.dataset.id){ const v = e.target.value; if(v) marks[e.target.dataset.id]=v; else delete marks[e.target.dataset.id]; save(); render(); }
  if(e.target.id==="show") render();
});
$("q").addEventListener("input", render);
window.addEventListener("hashchange", () => location.reload());
unlock();
</script>
</body>
</html>
